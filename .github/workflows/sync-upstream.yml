name: Sync upstream
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Merge upstream into fork
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT }}
        run: gh api -X POST repos/${{ github.repository }}/merge-upstream -f branch=main
